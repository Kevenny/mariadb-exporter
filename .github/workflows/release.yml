name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod pins only the minimum (1.26.0), which lacks
          # the standard library security fixes govulncheck checks for.
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
