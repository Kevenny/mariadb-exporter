# Custom metrics example for mariadb_exporter.
#
# Usage:
#   mariadb_exporter --custom-metrics=/etc/mariadb_exporter/example.yml
#
# Multiple files can be combined by repeating the flag:
#   --custom-metrics=a.yml --custom-metrics=b.yml
#
# Rules:
#   - The block key is the exposed metric name.
#   - `query` is the SQL executed on every scrape (keep it cheap).
#   - Every column in the result set must be declared in `metrics` with a
#     `usage`: LABEL, COUNTER or GAUGE.
#   - With more than one value column, the column name is suffixed to the
#     metric name (e.g. mariadb_custom_io_reads, mariadb_custom_io_writes).

mariadb_active_sessions_by_schema:
  query: |
    SELECT db AS schema_name,
           command,
           COUNT(*) AS total
    FROM information_schema.PROCESSLIST
    WHERE db IS NOT NULL
    GROUP BY db, command
  metrics:
    - schema_name:
        usage: "LABEL"
        description: "Database schema"
    - command:
        usage: "LABEL"
        description: "Command type"
    - total:
        usage: "GAUGE"
        description: "Total active sessions by schema and command"

# Data and index size by schema — useful for tracking growth.
mariadb_schema_size_bytes:
  query: |
    SELECT table_schema AS schema_name,
           COALESCE(SUM(data_length), 0)  AS data_bytes,
           COALESCE(SUM(index_length), 0) AS index_bytes
    FROM information_schema.TABLES
    WHERE table_schema NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
    GROUP BY table_schema
  metrics:
    - schema_name:
        usage: "LABEL"
        description: "Database schema"
    - data_bytes:
        usage: "GAUGE"
        description: "Bytes occupied by data in the schema"
    - index_bytes:
        usage: "GAUGE"
        description: "Bytes occupied by indexes in the schema"

# Oldest running transaction: detects long transactions holding onto undo log
# and metadata locks.
mariadb_longest_transaction_seconds:
  query: |
    SELECT COALESCE(MAX(TIMESTAMPDIFF(SECOND, trx_started, NOW())), 0) AS seconds
    FROM information_schema.INNODB_TRX
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Duration of the oldest active transaction in seconds"

# Indexes that are truly orphaned (never read since the last restart).
#
# The native mariadb_index_unused metric depends on the index showing up in
# INDEX_STATISTICS with ROWS_READ = 0 — but MariaDB only inserts into that
# table indexes that have already been read at least once. An index that was
# never touched simply doesn't exist in that table, so it's never detected.
#
# This LEFT JOIN solves that by comparing declared indexes (STATISTICS)
# against the ones that recorded a read (INDEX_STATISTICS). The result is the
# count per schema; use the "Tables & Indexes" dashboard for the detail.
#
# Careful: only trust the result if the server's uptime covers a full business
# cycle — an index used only during month-end closing looks orphaned if the
# server restarted yesterday.
mariadb_orphan_indexes:
  query: |
    SELECT s.TABLE_SCHEMA AS schema_name,
           COUNT(*) AS total
    FROM information_schema.STATISTICS s
    LEFT JOIN information_schema.INDEX_STATISTICS i
      ON  i.TABLE_SCHEMA = s.TABLE_SCHEMA
      AND i.TABLE_NAME   = s.TABLE_NAME
      AND i.INDEX_NAME   = s.INDEX_NAME
    WHERE i.INDEX_NAME IS NULL
      AND s.INDEX_NAME <> 'PRIMARY'
      AND s.TABLE_SCHEMA NOT IN ('mysql', 'information_schema', 'performance_schema', 'sys')
    GROUP BY s.TABLE_SCHEMA
  metrics:
    - schema_name:
        usage: "LABEL"
        description: "Database schema"
    - total:
        usage: "GAUGE"
        description: "Declared indexes that never recorded a read"
