# Local development environment: MariaDB 11.4 with the exclusive plugins
# enabled + the exporter pointed at it.
#
#   docker compose up -d --build
#   curl localhost:9104/metrics
#   curl localhost:9104/health

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_exporter_dev_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: demo
    ports:
      - "3306:3306"
    command:
      # userstat feeds the userstat, tablestat, indexstat and clientstat collectors.
      - --userstat=1
      # The response time plugin needs to be loaded and turned on.
      - --plugin-load-add=query_response_time
      - --query-response-time-stats=ON
      - --plugin-load-add=metadata_lock_info
      - --plugin-load-add=disks
      - --performance-schema=ON
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

  exporter:
    build:
      context: .
      args:
        VERSION: dev
    container_name: mariadb_exporter_dev
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_DSN: "mariadb://root:root@tcp(mariadb:3306)/"
      MARIADB_LOG_LEVEL: debug
    ports:
      - "9104:9104"
    command:
      - --collector.galera
      # The dashboards filter by cluster/environment/service_name; setting
      # these metadata here gives the template variables real values in the
      # development environment, exercising the filters for real.
      - --pmm.cluster=dev-cluster
      - --pmm.environment=dev
      - --pmm.service-name=mariadb-dev
      # Enables the mariadb_orphan_indexes custom metric, used by the
      # "Tables & Indexes" dashboard to detect truly unused indexes.
      - --custom-metrics=/custom_metrics/example.yml
    volumes:
      - ./custom_metrics:/custom_metrics:ro

volumes:
  mariadb_data:
