# Stack completa para testar o mariadb_exporter como data source de verdade:
# MariaDB -> exporter -> Prometheus -> Grafana, igual ao fluxo que hoje existe
# para o mysqld_exporter.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
#   Prometheus: http://localhost:9090  (Status > Targets para ver o scrape)
#   Grafana:    http://localhost:3000  (admin/admin) -> dashboard "MariaDB Exporter"
#
# Este arquivo estende o docker-compose.yml da raiz (que já sobe MariaDB +
# exporter); ele não deve ser usado sozinho.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mariadb_exporter_dev_prometheus
    volumes:
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:latest
    container_name: mariadb_exporter_dev_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dev/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
