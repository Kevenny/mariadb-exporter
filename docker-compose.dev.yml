# Full stack to test mariadb_exporter as a real data source:
# MariaDB -> exporter -> Prometheus -> Grafana, just like the flow that exists
# today for mysqld_exporter.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
#   Prometheus: http://localhost:9090  (Status > Targets to see the scrape)
#   Grafana:    http://localhost:3000  (admin/admin) -> "MariaDB Exporter" dashboard
#
# This file extends the root docker-compose.yml (which already brings up
# MariaDB + the exporter); it should not be used on its own.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mariadb_exporter_dev_prometheus
    volumes:
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:latest
    container_name: mariadb_exporter_dev_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounts the repository's versioned dashboards: editing a JSON file in
      # dashboards/ is reflected in Grafana within 30s (updateIntervalSeconds),
      # with no need to re-import anything.
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
