# mariadb_alerts.yml
#
# Alert rules for mariadb_exporter, in Prometheus rule format
# (mariadb_exporter_pmm_integration.md, section 10).
#
# Import via PMM UI → Alerting → Alert Rules → + New Alert Rule, or load as a
# rule in Prometheus/VictoriaMetrics itself if the exporter is used outside
# PMM (see docker-compose.dev.yml for the local test environment).
#
# The service_name/cluster/environment labels used in $labels depend on the
# --pmm.service-name, --pmm.cluster and --pmm.environment flags being
# configured on the exporter (see section 3 of the integration document);
# without them, the annotations are empty but the alerts still work normally.

groups:
  - name: mariadb_availability
    rules:
      - alert: MariaDBDown
        expr: mariadb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB instance unavailable"
          description: "{{ $labels.service_name }} has been offline for more than 1 minute."

      - alert: MariaDBHighLatency
        expr: |
          histogram_quantile(0.99,
            rate(mariadb_query_response_time_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 1s"
          description: "{{ $labels.service_name }} with P99={{ $value }}s over the last 5 minutes."

      - alert: MariaDBReplicationLag
        expr: mariadb_slave_seconds_behind_master > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High replication lag"
          description: "{{ $labels.service_name }} lagging by {{ $value }}s."

      - alert: MariaDBDiskAlmostFull
        expr: |
          (mariadb_disk_used_bytes / mariadb_disk_total_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB disk above 85%"
          description: "{{ $labels.service_name }} — path={{ $labels.path }} at {{ $value | humanizePercentage }}."

      - alert: MariaDBMetadataLockAccumulation
        expr: mariadb_metadata_locks_total > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many active MDL locks"
          description: "{{ $labels.service_name }} has {{ $value }} active metadata locks."
